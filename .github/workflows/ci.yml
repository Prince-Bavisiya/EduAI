name: EduAI CI/CD Quality Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend CI (Lint, Prisma Validate, Migrations, Integration & Security Tests)
  # ============================================================================
  backend-ci:
    name: Backend CI & Security Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduai_test
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduai_test
          SUPER_ADMIN_EMAIL: superadmin@example.com
          SUPER_ADMIN_PASSWORD: SuperPassword123
        run: node prisma/seed.js

      - name: Start Backend Server in Background
        working-directory: backend
        env:
          PORT: 5000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduai_test
          JWT_SECRET: ci_test_jwt_secret_key_12345
          SUPER_ADMIN_EMAIL: superadmin@example.com
          SUPER_ADMIN_PASSWORD: SuperPassword123
        run: |
          node server.js &
          sleep 3

      - name: Run Tenant Isolation Security Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduai_test
          PORT: 5000
        run: npm run test:tenant

      - name: Run Portal Role & IDOR Security Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduai_test
          PORT: 5000
        run: npm run test:security

      - name: Run End-to-End API Integration Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduai_test
          PORT: 5000
        run: npm run test:integration

  # ============================================================================
  # 2. Frontend CI (Type Checking, ESLint, Production Next.js Build)
  # ============================================================================
  frontend-ci:
    name: Frontend CI & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate TypeScript Types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build Next.js Production Bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ============================================================================
  # 3. Docker Compose & Container Build Verification
  # ============================================================================
  docker-ci:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Compose Images
        run: docker compose build
